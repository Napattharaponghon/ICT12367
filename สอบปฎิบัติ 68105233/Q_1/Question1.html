<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Product Catalog</title>

<!-- Bootstrap -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<style>
*{
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

/* Background หลัก */
body{
    font-family: 'Segoe UI', sans-serif;
    background-color: #f6f1e9;
    color: #5a4a42;
}

/* Header */
header{
    background-color: #e8dfd6;
    color: #4b3f38;
}

/* Product Card */
.product-card{
    background-color: #fffaf3;
    padding: 15px;
    text-align: center;
    border: 2px solid #e5d9cc;
    border-radius: 12px;
    transition: 0.35s;
    overflow: hidden;
}

/* ล็อคขนาดรูปสินค้า */
.product-card img{
    width: 100%;
    height: 220px;        
    object-fit: cover;   
    border-radius: 10px;
    transition: 0.35s;
}

/* Hover Effect */
.product-card:hover img{
    transform: scale(1.08);
}

/* เปลี่ยนขอบตอน hover */
.product-card:hover{
    border-color: #c8a97e;
    box-shadow: 0 10px 25px rgba(0,0,0,0.15);
}

/* ชื่อสินค้า */
.product-card h5{
    margin-top: 12px;
    font-weight: 600;
}

/* Footer */
footer{
    background-color: #e8dfd6;
    color: #4b3f38;
    margin-top: 50px;
}
</style>

<body>

<!-- Header -->
<header class="text-center py-5 bg-dark text-white">
    <h1>WELLCOME TO HONGWILAI</h1>
    <p>สินค้าแนะนำจากแบรนด์ของเรา</p>
</header>

<!-- Product Section -->
<div class="container my-5">
    <div class="row g-4">
            <!-- Product 1 -->
        <div class="col-md-4">
            <div class="product-card">
                <img src="https://images.pexels.com/photos/90946/pexels-photo-90946.jpeg" class="img-fluid">
                <h5>Product 1</h5>
            </div>
        </div>

        <!-- Product 2 -->
        <div class="col-md-4">
            <div class="product-card">
                <img src="https://images.pexels.com/photos/7897470/pexels-photo-7897470.jpeg" class="img-fluid">
                <h5>Product 2</h5>
            </div>
        </div>

        <!-- Product 3 -->
        <div class="col-md-4">
            <div class="product-card">
                <img src="https://images.pexels.com/photos/335257/pexels-photo-335257.jpeg" class="img-fluid">
                <h5>Product 3</h5>
            </div>
        </div>

        <!-- Product 4 -->
        <div class="col-md-4">
            <div class="product-card">
                <img src="https://images.pexels.com/photos/7428092/pexels-photo-7428092.jpeg" class="img-fluid">
                <h5>Product 4</h5>
            </div>
        </div>

        <!-- Product 5 -->
        <div class="col-md-4">
            <div class="product-card">
                <img src="https://images.pexels.com/photos/8128069/pexels-photo-8128069.jpeg" class="img-fluid">
                <h5>Product 5</h5>
            </div>
        </div>

        <!-- Product 6 -->
        <div class="col-md-4">
            <div class="product-card">
                <img src="https://images.pexels.com/photos/3785147/pexels-photo-3785147.jpeg" class="img-fluid">
                <h5>Product 6</h5>
            </div>
        </div>
    </div>
</div>

<!-- Footer -->
<footer class="text-center py-3 bg-dark text-white">
    <p>© 2026 HONGWILAI COMPANY</p>
    <p>Student: 68105233 Napattharapong Hongwilai</p>
</footer>

</body>
</html>

<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Feedback Form</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

<style>

body{
    background: linear-gradient(135deg,#f5efe6,#fdfaf6);
    font-family: 'Segoe UI', sans-serif;
}

/* กล่องฟอร์ม */
.form-box{
    max-width:600px;
    margin:auto;
    margin-top:90px;
    background:#fffaf3;
    padding:35px;
    border-radius:15px;
    box-shadow:0 10px 30px rgba(0,0,0,0.1);
    animation:fadeIn 1s ease;
}

/* animation ตอนโหลด */
@keyframes fadeIn{
    from{
        opacity:0;
        transform:translateY(20px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}

h3{
    color:#6b4f3b;
    font-weight:600;
}

/* textarea */
textarea{
    resize:none;
    border-radius:10px !important;
    transition:0.3s;
}

textarea:focus{
    border-color:#c8a97e;
    box-shadow:0 0 10px rgba(200,169,126,0.4);
}

/* ตัวนับตัวอักษร */
.char-count{
    font-size:14px;
    margin-top:5px;
    text-align:right;
    color:#7a6a5c;
}

/* progress bar */
.progress{
    height:8px;
    margin-top:8px;
    background:#eee3d5;
}

.progress-bar{
    background:#c8a97e;
    transition:0.3s;
}

/* ปุ่ม */
.btn-submit{
    background:#c8a97e;
    color:white;
    border:none;
    padding:10px;
    border-radius:10px;
    font-weight:500;
    transition:0.3s;
}

.btn-submit:hover{
    background:#a8865f;
    transform:translateY(-2px);
}

</style>
</head>

<body>

<div class="container">

<div class="form-box">

<h3 class="mb-4 text-center">Customer Feedback</h3>

<form>

<div class="mb-3">
<label class="form-label">ชื่อผู้ส่ง</label>
<input type="text" class="form-control">
</div>

<div class="mb-3">

<label class="form-label">ข้อเสนอแนะ / ร้องเรียน</label>

<textarea
id="feedback"
class="form-control"
rows="5"
maxlength="200"
placeholder="พิมพ์ข้อความของคุณ..."
></textarea>

<div class="char-count">
<span id="charCount">0</span> / 200
</div>

<div class="progress">
<div id="progressBar" class="progress-bar" style="width:0%"></div>
</div>

</div>

<button type="submit" class="btn-submit w-100">
ส่งข้อเสนอแนะ
</button>

</form>

</div>

</div>

<script>

const feedback = document.getElementById("feedback");
const charCount = document.getElementById("charCount");
const progressBar = document.getElementById("progressBar");

const maxLength = 200;

feedback.addEventListener("input", function(){

let length = feedback.value.length;

charCount.textContent = length;

let percent = (length / maxLength) * 100;

progressBar.style.width = percent + "%";

/* เปลี่ยนสีเมื่อใกล้เต็ม */
if(length > 150){
progressBar.style.background = "#d9534f";
charCount.style.color = "#d9534f";
}
else{
progressBar.style.background = "#c8a97e";
charCount.style.color = "#7a6a5c";
}

});

</script>

</body>
</html>
